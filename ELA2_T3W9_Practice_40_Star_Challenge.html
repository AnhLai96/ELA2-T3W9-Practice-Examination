<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ELA Review Adventure</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#fff1d3,#f9dce6);font:20px system-ui,sans-serif;color:#52132b}main{max-width:920px;margin:auto;padding:20px}header{background:#80132f;color:white;border-radius:24px;padding:22px;text-align:center;border:4px solid #e8b86d}h1{margin:6px;font-size:clamp(25px,5vw,40px)}small{font-size:15px}article{background:#fff9f2;border:3px solid #e8b86d;border-radius:24px;padding:22px;margin-top:16px;box-shadow:0 8px 0 #e8b86d66}.scene{background:linear-gradient(#d9f4ff,#fff0b8);border:3px solid white;border-radius:20px;text-align:center;padding:18px;font-size:clamp(42px,9vw,86px);letter-spacing:0;min-height:130px;display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap}button{font:inherit;cursor:pointer;border:2px solid #e8b86d;border-radius:14px;padding:12px;background:#fff;color:#52132b;font-weight:650}button:focus-visible{outline:4px solid #1678a0}button:disabled{opacity:.55;cursor:default}.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}.choice{text-align:left;min-height:85px;background:#fff3d2}.choice:nth-child(even){background:#ffe5eb}.correct{background:#d9f5d9!important;border-color:#248348}.wrong{background:#ffd9d9!important;border-color:#b52b43}.letter{display:inline-block;background:#80132f;color:white;border-radius:50%;width:30px;text-align:center;margin-right:8px}.bar{height:13px;background:#ead5d9;border-radius:20px;overflow:hidden;margin:10px 0}.fill{height:100%;background:#e5a62c;transition:width .3s}.nav{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;margin-top:16px}.primary{background:#80132f;color:white}.trail{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}.trail button{font-size:13px;padding:5px;min-width:32px}.trail .current{outline:3px solid #80132f}.feedback{min-height:42px;padding:10px 0}h2{font-size:clamp(21px,4vw,28px)}@media(max-width:550px){.choices{grid-template-columns:1fr}main{padding:10px}article{padding:14px}}</style><main><header><small>WPA • ELA 2 • TERM 3 • WEEK 9</small><h1>📚 ELA Review Adventure</h1><div>Practice Exam • The 40-Star Challenge</div></header><article id="game"></article></main><script>const Q=[{"q": "Who helps people when they are sick?", "a": ["A baker", "A nurse", "A cleaner", "A driver"], "k": 1, "scene": "🤒 🏥 💊"}, {"q": "What does cautious mean in “The driver was cautious”?", "a": ["Careful", "Sleepy", "Noisy", "Angry"], "k": 0, "scene": "🚗 🚦 🛣️"}, {"q": "Which word means almost the same as quick?", "a": ["Quiet", "Fast", "Heavy", "Late"], "k": 1, "scene": "🐢 🐇 🏁"}, {"q": "Which text feature tells the topic of a section?", "a": ["Caption", "Heading", "Page number", "Glossary"], "k": 1, "scene": "📖 📰 🔍"}, {"q": "What does a caption usually explain?", "a": ["A photograph", "A book price", "A story ending", "A question mark"], "k": 0, "scene": "📷 📖 🖼️"}, {"q": "Which sentence is a fact?", "a": ["Parks are the best places", "All spiders are funny", "Nurses help patients", "Frogs are the cutest"], "k": 2, "scene": "🌳 🕷️ 🏥 🐸"}, {"q": "What is the main idea of “Bakers, nurses and truck drivers work at night”?", "a": ["Only nurses work at night", "Many jobs happen at night", "All workers drive trucks", "Bread is always cold"], "k": 1, "scene": "🌙 🍞 🏥 🚚"}, {"q": "What is the setting of a story?", "a": ["The author’s opinion", "Where and when it happens", "The book cover", "The lesson title"], "k": 1, "scene": "🏞️ 🌅 📖"}, {"q": "Which word describes a character who shares?", "a": ["Greedy", "Kind", "Selfish", "Rude"], "k": 1, "scene": "🧒 🍎 🧒"}, {"q": "Which detail shows that Spider is greedy?", "a": ["He eats too much food", "He listens carefully", "He gives food away", "He cleans a room"], "k": 0, "scene": "🕷️ 🍌 🍇"}, {"q": "Which two texts are informational nonfiction?", "a": ["Neighborhood Helpers and Who Works at Night?", "Snake and Frog and Spider’s Greed", "Spider’s Greed and a fairy tale", "A poem and a folktale"], "k": 0, "scene": "📚 🏘️ 🌙 🐸"}, {"q": "Which word signals a similarity?", "a": ["However", "Both", "But", "Unlike"], "k": 1, "scene": "🐸 🐸 🔍"}, {"q": "Which word signals a difference?", "a": ["Also", "Both", "But", "Too"], "k": 2, "scene": "🐸 🕷️ 🔍"}, {"q": "Which statement is an opinion?", "a": ["A week has seven days", "Nurses care for patients", "The library is the best place", "A spider has eight legs"], "k": 2, "scene": "📅 📚 🕷️"}, {"q": "Which sentence is a reason for “We need a dog park”?", "a": ["The park is green", "Dogs need a safe place to run", "I have a dog", "Parks have gates"], "k": 1, "scene": "🐕 🌳 🐾"}, {"q": "Which sentence is a good opinion opening?", "a": ["I think our school needs a garden.", "A garden has plants.", "The school is on a street.", "We walked outside yesterday."], "k": 0, "scene": "🏫 🌱 💭"}, {"q": "Which word best connects an opinion to a reason?", "a": ["Because", "Under", "Yesterday", "Again"], "k": 0, "scene": "📖 💬 🧩"}, {"q": "Which is a strong closing for an opinion about reading?", "a": ["Books have pages.", "That is why I love reading.", "I saw a book.", "The library opens early."], "k": 1, "scene": "📚 📝 💭"}, {"q": "Which sentence gives evidence for “Mia is helpful”?", "a": ["Mia has a blue bag.", "Mia helped her friend carry books.", "Mia likes the colour blue.", "Mia walked home."], "k": 1, "scene": "🧒 📚 🎒"}, {"q": "Which is a question?", "a": ["The frog is green.", "Please sit down.", "Where is the frog?", "What a big frog!"], "k": 2, "scene": "🐸 💬"}, {"q": "The puppy sleeps ___ the table.", "a": ["under", "on Monday", "at noon", "in July"], "k": 0, "scene": "🐶 🪑 💤"}, {"q": "Our lesson starts ___ 9 o’clock.", "a": ["in", "on", "at", "under"], "k": 2, "scene": "🏫 🕘"}, {"q": "We visit Grandma ___ Sunday.", "a": ["in", "on", "at", "behind"], "k": 1, "scene": "👵 📅 🏡"}, {"q": "The holiday is ___ December.", "a": ["on", "at", "under", "in"], "k": 3, "scene": "📅 ❄️ 🎄"}, {"q": "Which sentence has correct commas in a list?", "a": ["I bought apples bananas, and pears.", "I bought apples, bananas, and pears.", "I bought, apples bananas and pears.", "I bought apples bananas and, pears."], "k": 1, "scene": "🍎 🍌 🍐"}, {"q": "Which date is written correctly?", "a": ["June 5 2026", "June, 5 2026", "June 5, 2026", "June, 5, 2026"], "k": 2, "scene": "📅 📝"}, {"q": "What does reread mean?", "a": ["Read again", "Read loudly", "Read quickly", "Stop reading"], "k": 0, "scene": "📖 🧒 🔍"}, {"q": "What does replay mean?", "a": ["Play outside", "Play again", "Play quietly", "Play alone"], "k": 1, "scene": "⚽ 🎮 🧒"}, {"q": "Which word means “full of joy”?", "a": ["Joyless", "Joyful", "Rejoy", "Joying"], "k": 1, "scene": "😊 🎈 🌈"}, {"q": "Which word uses the suffix -ful?", "a": ["Redo", "Unkind", "Helpful", "Replay"], "k": 2, "scene": "🔤 🧩 📚"}, {"q": "Which word shows the strongest heat?", "a": ["Warm", "Mild", "Hot", "Scorching"], "k": 3, "scene": "☀️ 🌡️ 🏜️"}, {"q": "Which word shows the strongest anger?", "a": ["Annoyed", "Furious", "Bothered", "Unhappy"], "k": 1, "scene": "😐 😠 😟"}, {"q": "Which sentence is a statement?", "a": ["Close the door.", "Where is my bag?", "The dog is sleeping.", "What a surprise!"], "k": 2, "scene": "🐕 💤 💬"}, {"q": "Which sentence is a command?", "a": ["Please line up.", "Do you like art?", "The class is quiet.", "What a great day!"], "k": 0, "scene": "🏫 🧒 🧒"}, {"q": "Which sentence is an exclamation?", "a": ["My bag is red.", "Please pass the book.", "Where is the bus?", "What a wonderful surprise!"], "k": 3, "scene": "🎁 🎒 🚌"}, {"q": "Which sentence ends with the correct punctuation?", "a": ["Where is my pencil.", "Where is my pencil?", "Where is my pencil!", "Where is my pencil,"], "k": 1, "scene": "✏️ 🎒 🔍"}, {"q": "Which sentence uses a capital letter correctly?", "a": ["we went to the park.", "We went to the park.", "We went to the Park.", "we Went to the park."], "k": 1, "scene": "🌳 🛝 🧒"}, {"q": "Which word belongs in “The book is ___ the shelf”?", "a": ["at noon", "on", "in May", "on Friday"], "k": 1, "scene": "📚 🪵 🔍"}, {"q": "Which part belongs first in an opinion paragraph?", "a": ["Closing sentence", "Opinion statement", "Last reason", "Signature"], "k": 1, "scene": "📝 💭 📄"}, {"q": "Which is the best way to check a reading answer?", "a": ["Guess quickly", "Choose the longest option", "Reread and find evidence", "Skip every difficult word"], "k": 2, "scene": "📖 🔍 🧒"}];let i=0,answers=Array(40).fill(null);const g=document.getElementById('game');const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));const score=()=>answers.filter((a,j)=>a===Q[j].k).length;const done=()=>answers.filter(a=>a!==null).length;function speak(){if(!('speechSynthesis'in window)){alert('Read aloud is not available in this browser.');return}speechSynthesis.cancel();let q=Q[i],u=new SpeechSynthesisUtterance(q.q+' '+q.a.map((a,j)=>String.fromCharCode(65+j)+'. '+a).join('. '));u.lang='en-US';u.rate=.85;speechSynthesis.speak(u)}function go(j){if('speechSynthesis'in window)speechSynthesis.cancel();i=j;render()}function pick(j){if(answers[i]!==null)return;answers[i]=j;render()}function render(){let q=Q[i],a=answers[i];g.innerHTML=`<small> ${['Word & Story Village','Reading & Opinion Library','Grammar Workshop','Writing & Word Castle'][Math.floor(i/10)]}</small><div class="nav"><b>Mission ${i+1} / 40</b><b>⭐ ${score()} stars • ${score()*2.5}/100</b></div><div class="bar"><div class="fill" style="width:${done()/40*100}%"></div></div><div class="scene" role="img" aria-label="Illustrated context for this question">${q.scene.split(" ").map((x,j)=>`<span style="display:inline-flex;align-items:center;justify-content:center;background:${["#fff8d9","#e0f6ff","#ffe4ec","#e4f5d9"][j%4]};border:3px solid white;border-radius:24px;width:clamp(65px,17vw,145px);height:clamp(80px,18vw,145px);box-shadow:0 5px 0 #c99d6940;letter-spacing:0">${x}</span>`).join("")}</div><h2>${esc(q.q)}</h2><button onclick="speak()">🔊 Read aloud</button><p><small>Choose one answer.</small></p><div class="choices">${q.a.map((v,j)=>`<button class="choice ${a!==null?(j===q.k?'correct':j===a?'wrong':''):''}" onclick="pick(${j})" ${a!==null?'aria-disabled="true"':''}><span class="letter">${String.fromCharCode(65+j)}</span>${esc(v)}</button>`).join('')}</div><div class="feedback" aria-live="polite">${a===null?'':a===q.k?'⭐ Great job! You earned a star. '+esc(q.a[q.k]):'Keep learning! Correct answer: '+esc(q.a[q.k])}</div><div class="nav"><button onclick="go(${i-1})" ${i===0?'disabled':''}>← Previous</button><button class="primary" onclick="${i===39?'finish()':`go(${i+1})`}">${i===39?'See results':'Next →'}</button></div><div class="trail">${Q.map((v,j)=>`<button aria-label="Question ${j+1}" class="${j===i?'current':''}" onclick="go(${j})">${answers[j]===v.k?'⭐':answers[j]!==null?'✓':j+1}</button>`).join('')}</div>`}function finish(){if(done()<40){if(!confirm('You have '+(40-done())+' unanswered questions. Finish anyway?'))return}g.innerHTML=`<h1>🏆 Adventure complete!</h1><h2>${score()*2.5} / 100 points</h2><p>${score()} of 40 correct • ${done()} answered</p><div class="nav"><button onclick="go(0)">Review in game</button><button class="primary" onclick="answers.fill(null);go(0)">Play again</button></div><h2>Answer review</h2>${Q.map((q,j)=>`<p><b>${j+1}. ${esc(q.q)}</b><br>${answers[j]===q.k?'⭐ Correct':answers[j]===null?'Not answered':'Your answer: '+esc(q.a[answers[j]])}<br>Correct: ${esc(q.a[q.k])}</p>`).join('')}`}render();</script></html>
